<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stridekeep · Option B — Profile-as-tab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Material+Symbols+Sharp&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#2b3138; --card:#353c46; --cardHi:#404853; --overlay:#1f242a;
    --cream:#f1ede4; --muted:#8d959e; --dim:#5b6068;
    --brass:#c79c4a; --brassLight:#f0d091; --brassDeep:#8e6a2c;
    --red:#c44b3a; --blue:#6589b8; --teal:#5fc9a3; --purple:#a16fc9;
    --border:#4d5560; --pixel:'Press Start 2P',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#1a1d22;color:var(--cream);font-family:var(--pixel);font-size:9px;line-height:1.4;-webkit-font-smoothing:none;font-smoothing:none;image-rendering:pixelated;text-rendering:geometricPrecision;padding:24px;display:flex;justify-content:center;align-items:flex-start;gap:24px;flex-wrap:wrap}
  .phone{width:390px;height:844px;background:var(--bg);border:3px solid #000;box-shadow:0 0 0 6px #444,0 0 0 8px #000,0 24px 60px rgba(0,0,0,.6);position:relative;display:flex;flex-direction:column;overflow:hidden}
  .phone::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:120px;height:24px;background:#000;border-radius:0 0 10px 10px;z-index:50}
  .label{font-family:var(--pixel);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;width:390px;text-align:center;margin-top:8px}
  .label b{color:var(--brassLight)}
  .topHeader{padding:30px 12px 8px;border-bottom:2px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--bg)}
  .brand{font-size:12px;color:var(--brassLight);letter-spacing:2px}
  .topRight{display:flex;gap:6px;align-items:center}
  .seasonChip{font-size:7px;color:var(--muted);background:var(--overlay);border:1px solid var(--border);padding:4px 6px;letter-spacing:1px}
  .gear{width:28px;height:28px;background:var(--card);border:2px solid var(--border);display:grid;place-items:center;color:var(--brassLight);font-family:'Material Symbols Sharp';font-size:18px;font-feature-settings:'FILL' 1}
  .infoStrip{display:flex;justify-content:space-between;padding:8px 12px;background:var(--overlay);border-bottom:2px solid var(--border)}
  .infoStrip .v{font-size:10px;color:var(--brassLight)}
  .infoStrip .k{font-size:7px;color:var(--muted);letter-spacing:1px;margin-bottom:2px}
  .panel{flex:1;overflow:auto;padding:10px}
  .canvasFrame{margin:0 auto;width:330px;height:330px;background:#181a1d;border:3px solid var(--red);padding:0;position:relative;display:grid;grid-template-columns:repeat(24,1fr);grid-template-rows:repeat(24,1fr)}
  .canvasMeta{margin-top:10px;padding:8px 10px;background:repeating-linear-gradient(0deg,var(--card) 0 1px,#3a414a 1px 2px);border:2px solid var(--border)}
  .canvasMeta .titlerow{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
  .canvasMeta .title{font-size:9px;color:var(--brassLight);letter-spacing:1.5px}
  .canvasMeta .pct{font-size:9px;color:var(--cream)}
  .progressBar{height:6px;background:#1a1d22;border:1px solid var(--border);position:relative}
  .progressBar .fill{position:absolute;left:0;top:0;bottom:0;background:var(--red);width:38%;box-shadow:inset 0 -1px rgba(0,0,0,.3)}
  .sectionKicker{font-size:9px;color:var(--brass);letter-spacing:2px;margin:14px 4px 8px}
  .caseCard{background:repeating-linear-gradient(0deg,var(--card) 0 1px,#3a414a 1px 2px);border:2px solid var(--border);border-left:4px solid var(--brassLight);padding:10px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
  .caseCard.fine{border-left-color:var(--brassLight)}
  .caseCard.quality{border-left-color:var(--blue)}
  .caseCard.starter{border-left-color:var(--brass)}
  .medallion{width:36px;height:36px;background:var(--overlay);border:2px solid var(--border);display:grid;place-items:center;font-size:16px;font-family:system-ui}
  .caseCard.fine .medallion{background:rgba(240,208,145,.14);border-color:var(--brassLight)}
  .caseCard.quality .medallion{background:rgba(101,137,184,.18);border-color:var(--blue)}
  .caseCard.starter .medallion{background:rgba(199,156,74,.14);border-color:var(--brass)}
  .caseInfo{flex:1}
  .caseName{font-size:8px;color:var(--cream);letter-spacing:1px;margin-bottom:5px}
  .caseProgress{display:flex;gap:6px;align-items:center}
  .caseBar{flex:1;height:4px;background:var(--overlay);border:1px solid var(--border)}
  .caseBar .f{height:100%;background:var(--brass)}
  .caseSteps{font-size:7px;color:var(--muted);letter-spacing:0.5px;min-width:60px;text-align:right;font-family:var(--pixel)}
  .openBtn{font-family:var(--pixel);font-size:7px;background:var(--brass);color:var(--bg);padding:5px 8px;letter-spacing:1px;border:none;border-bottom:3px solid var(--brassDeep);cursor:pointer}
  .idleBtn{font-family:var(--pixel);font-size:7px;color:var(--muted);background:transparent;border:2px solid var(--border);padding:4px 7px;letter-spacing:1px}
  .bottomNav{display:flex;border-top:2px solid var(--border);background:var(--bg);padding-bottom:14px}
  .bottomNav .navTab{flex:1;text-align:center;padding:10px 0;font-size:7px;color:var(--muted);letter-spacing:1.5px;cursor:pointer}
  .bottomNav .navTab.active{color:var(--brassLight);background:linear-gradient(0deg,rgba(199,156,74,.10) 0,transparent 80%)}
  .bottomNav .navTab .ico{display:block;font-family:'Material Symbols Sharp';font-size:18px;margin-bottom:2px;font-feature-settings:'FILL' 1}
</style>
</head>
<body>
<div>
<div class="phone">
  <div class="topHeader">
    <div class="brand">STRIDEKEEP</div>
    <div class="topRight">
      <div class="seasonChip">S1 · D12</div>
      <div class="gear">settings</div>
    </div>
  </div>

  <div class="infoStrip">
    <div><div class="k">STEPS</div><div class="v">12,438</div></div>
    <div><div class="k">PURSE</div><div class="v">$12,438</div></div>
    <div><div class="k">CAP IN</div><div class="v">2D 14H</div></div>
  </div>

  <div class="panel">
    <div class="canvasFrame" id="canvas24"></div>
    <div class="canvasMeta">
      <div class="titlerow">
        <div class="title">RED MURAL · OUR TEAM</div>
        <div class="pct">38%</div>
      </div>
      <div class="progressBar"><div class="fill"></div></div>
    </div>

    <div class="sectionKicker">MATERIALS</div>
    <div class="caseCard fine">
      <div class="medallion">💎</div>
      <div class="caseInfo">
        <div class="caseName">MASTER PIGMENTS</div>
        <div class="caseProgress">
          <div class="caseBar"><div class="f" style="width:62%"></div></div>
          <div class="caseSteps">3 PENDING</div>
        </div>
      </div>
      <button class="openBtn">OPEN</button>
    </div>
    <div class="caseCard quality">
      <div class="medallion">🧰</div>
      <div class="caseInfo">
        <div class="caseName">PIGMENT BOX</div>
        <div class="caseProgress">
          <div class="caseBar"><div class="f" style="width:34%"></div></div>
          <div class="caseSteps">1.3K / 4K</div>
        </div>
      </div>
      <span class="idleBtn">2.7K LEFT</span>
    </div>
    <div class="caseCard starter">
      <div class="medallion">📦</div>
      <div class="caseInfo">
        <div class="caseName">PIGMENT POUCH</div>
        <div class="caseProgress">
          <div class="caseBar"><div class="f" style="width:78%"></div></div>
          <div class="caseSteps">1 PENDING</div>
        </div>
      </div>
      <button class="openBtn">OPEN</button>
    </div>
  </div>

  <div class="bottomNav">
    <div class="navTab active"><span class="ico">home</span>HOME</div>
    <div class="navTab"><span class="ico">inventory_2</span>INVENTORY</div>
    <div class="navTab"><span class="ico">flag</span>TOWN</div>
    <div class="navTab"><span class="ico">person</span>PROFILE</div>
  </div>
</div>
<div class="label"><b>OPTION B</b> · Profile-as-tab (4 bottom tabs)</div>
</div>

<script>
(function(){
  var grid = document.getElementById('canvas24');
  if(!grid) return;
  var palette = ['#c44b3a','#a13c2e','#8e6a2c','#c79c4a','#f0d091','#7a3026','#d96a55','#5b3826'];
  function h(i,j){return ((i*73)^(j*131)+i*j*7)&0xff;}
  for(var i=0;i<24;i++){for(var j=0;j<24;j++){
    var d = document.createElement('div');
    d.className='pix';
    var v = h(i,j);
    if((v%10)<3){
      d.style.background = palette[v % palette.length];
    } else {
      var t = palette[(v*3) % palette.length];
      d.style.background = t;
      d.style.opacity = '0.18';
    }
    grid.appendChild(d);
  }}
})();
</script>
</body>
</html>
