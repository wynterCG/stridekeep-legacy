<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Modal · Case Reveal — Stridekeep Wood/Canyon</title>
<link rel="stylesheet" href="shared.css">
<style>
  /* Reuse cases screen styles for the dimmed background */
  .case-card {
    background: linear-gradient(180deg, var(--parchment-hi) 0%, var(--parchment) 100%);
    border: 1.5px solid var(--banner-edge);
    border-left-width: 5px;
    border-radius: 4px;
    padding: 10px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .case-card.starter { border-left-color: var(--tier-starter); }
  .case-card.quality { border-left-color: var(--tier-quality); }
  .case-card.fine { border-left-color: var(--tier-fine); }
  .medallion {
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 1.5px solid;
    display: grid; place-items: center;
    flex-shrink: 0;
    font-size: 20px;
  }
  .medallion.starter { background: rgba(199,156,74,0.30); border-color: var(--tier-starter); }
  .medallion.quality { background: rgba(122,159,212,0.32); border-color: var(--tier-quality); }
  .medallion.fine { background: rgba(240,200,120,0.36); border-color: var(--tier-fine); }
  .case-meta { flex: 1; }
  .case-name {
    font-family: 'Outfit', sans-serif;
    font-weight: 800;
    font-size: 13px;
    color: var(--ink);
    letter-spacing: 1.2px;
    margin-bottom: 4px;
  }
  .case-bar-track { background: rgba(40,24,8,0.30); height: 4px; border-radius: 2px; overflow: hidden; }
  .case-bar-fill { height: 100%; }
  .pill-open {
    padding: 5px 12px;
    background: linear-gradient(180deg, var(--brass-light) 0%, var(--brass) 100%);
    border: 1.5px solid var(--banner-edge);
    border-radius: 13px;
    font-family: 'Outfit', sans-serif;
    font-weight: 800;
    font-size: 11px;
    color: var(--ink);
    letter-spacing: 1.5px;
  }

  /* Dim underlying screen */
  .screen-dimmed > *:not(.modal-backdrop) { opacity: 0.30; filter: blur(0.5px); }

  /* CASE REVEAL — full-screen tier celebration */
  .reveal-backdrop {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center,
      rgba(40, 25, 10, 0.65) 0%,
      rgba(10, 6, 2, 0.95) 75%);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 200;
    padding: 0 24px;
  }
  .reveal-tier {
    font-family: 'Outfit', sans-serif;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--brass-light);
    text-transform: uppercase;
    margin-bottom: 8px;
    text-shadow: 0 0 12px rgba(240, 200, 120, 0.6);
  }
  .reveal-rarity {
    font-family: 'Outfit', sans-serif;
    font-weight: 900;
    font-size: 16px;
    letter-spacing: 2px;
    color: var(--brass-rim);
    text-transform: uppercase;
    margin-bottom: 22px;
    text-shadow:
      0 0 18px rgba(255, 220, 140, 0.85),
      0 1px 0 rgba(0,0,0,0.6);
  }
  .reveal-swatch-wrap {
    position: relative;
    margin-bottom: 22px;
  }
  .reveal-swatch-glow {
    position: absolute;
    inset: -28px;
    background: radial-gradient(circle, rgba(232, 100, 60, 0.55) 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
  }
  .reveal-swatch {
    position: relative;
    width: 160px; height: 160px;
    background: #c4543a;
    border: 4px solid var(--brass-light);
    border-radius: 6px;
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,0.30),
      inset 0 -8px 20px rgba(0,0,0,0.30),
      0 0 30px rgba(240, 200, 120, 0.45),
      0 8px 22px rgba(0,0,0,0.6);
  }
  .reveal-swatch::after {
    content: "";
    position: absolute; inset: 0;
    background-image:
      linear-gradient(0deg, rgba(255,255,255,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 12px 12px;
  }
  .reveal-name {
    font-family: 'Outfit', sans-serif;
    font-weight: 900;
    font-size: 30px;
    color: #fff8e0;
    letter-spacing: 1.5px;
    text-align: center;
    margin-bottom: 6px;
    text-shadow:
      0 2px 0 rgba(0,0,0,0.45),
      0 0 14px rgba(232, 100, 60, 0.45);
  }
  .reveal-meta {
    font-family: 'Outfit', sans-serif;
    font-weight: 600;
    font-size: 12px;
    color: var(--brass-light);
    letter-spacing: 1.2px;
    margin-bottom: 26px;
    font-style: italic;
  }
  .reveal-continue {
    width: 75%;
    max-width: 240px;
    padding: 13px 0;
    background: linear-gradient(180deg, var(--brass-light) 0%, var(--brass) 100%);
    border: 1.5px solid var(--banner-edge);
    border-radius: 4px;
    font-family: 'Outfit', sans-serif;
    font-weight: 800;
    font-size: 14px;
    color: var(--ink);
    letter-spacing: 2.5px;
    cursor: pointer;
    text-transform: uppercase;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.5),
      inset 0 -2px 3px rgba(80, 50, 10, 0.30),
      0 4px 12px rgba(240, 200, 120, 0.30);
  }
</style>
</head>
<body>
<div class="phone"><div class="screen screen-dimmed">

  <!-- Underlying cases screen, dimmed -->
  <div class="topbar">
    <svg class="shield" viewBox="0 0 42 50" fill="none">
      <defs>
        <linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4d7ec4"/><stop offset="1" stop-color="#234a82"/></linearGradient>
        <linearGradient id="rg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbe6b0"/><stop offset="1" stop-color="#8a6028"/></linearGradient>
      </defs>
      <path d="M21 1 L39 5 L38 28 C38 39 30 46 21 49 C12 46 4 39 4 28 L3 5 Z" fill="url(#sg)" stroke="url(#rg)" stroke-width="1.8"/>
      <ellipse cx="21" cy="22" rx="7" ry="10" fill="#f0d088"/>
    </svg>
    <div class="title-block">
      <div class="title">STRIDEKEEP:</div>
      <div class="subtitle">Season1 . CANYON</div>
    </div>
    <div class="utilities">
      <span class="util-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg></span>
      <span class="util-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/></svg></span>
    </div>
  </div>

  <div class="stats">
    <div class="day-line"><span class="label-day">DAY 3</span> <span class="sep">·</span> <span class="countdown">11d 4h<span class="left"> LEFT</span></span></div>
    <div class="stat-row">
      <div class="stat"><div class="num">4,345</div><div class="label">STEPS</div></div>
      <div class="stat-divider"></div>
      <div class="stat"><div class="num">$457</div><div class="label">PURSE</div></div>
    </div>
    <div class="tug">
      <div class="tug-side" style="flex:79">RED 79</div>
      <div class="tug-center">LEAD: RED +29</div>
      <div class="tug-side blue" style="flex:50">50 BLUE</div>
    </div>
  </div>

  <div class="subtabs">
    <div class="subtab">Mural</div>
    <div class="subtab active">Cases</div>
    <div class="subtab">Profile</div>
  </div>

  <div class="content">
    <div class="case-card fine">
      <div class="medallion fine">⬢</div>
      <div class="case-meta">
        <div class="case-name">FINE CASE</div>
        <div class="case-bar-track"><div class="case-bar-fill" style="width:78%;background:var(--tier-fine)"></div></div>
      </div>
      <button class="pill-open">OPEN</button>
    </div>
    <div class="case-card quality">
      <div class="medallion quality">◆</div>
      <div class="case-meta">
        <div class="case-name">QUALITY CASE</div>
        <div class="case-bar-track"><div class="case-bar-fill" style="width:34%;background:var(--tier-quality)"></div></div>
      </div>
    </div>
  </div>

  <div class="navbar">
    <div class="nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8 M5 10v10h5v-6h4v6h5V10"/></svg>
      <span>HOME</span>
      <span class="nav-state">Active</span>
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V5a3 3 0 016 0v3"/></svg>
      <span>INVENTORY</span>
    </div>
  </div>

  <!-- CASE REVEAL CELEBRATION -->
  <div class="reveal-backdrop">
    <div class="reveal-tier">FROM FINE CASE</div>
    <div class="reveal-rarity">★ RARE FINE ★</div>
    <div class="reveal-swatch-wrap">
      <div class="reveal-swatch-glow"></div>
      <div class="reveal-swatch" style="background:#c4543a"></div>
    </div>
    <div class="reveal-name">RUST RED</div>
    <div class="reveal-meta">3.2% drop · added to inventory</div>
    <button class="reveal-continue">CONTINUE</button>
  </div>

</div></div>
</body>
</html>
