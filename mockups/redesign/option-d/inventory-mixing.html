<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Inventory · Mixing — Stridekeep Wood/Canyon</title>
<link rel="stylesheet" href="shared.css">
<style>
  .recipe-card {
    background: linear-gradient(180deg, var(--parchment-hi) 0%, var(--parchment) 100%);
    border: 1.5px solid var(--banner-edge);
    border-left-width: 5px;
    border-left-color: var(--tier-purple);
    border-radius: 4px;
    padding: 10px 12px;
    margin-bottom: 8px;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.45),
      0 1px 3px rgba(0,0,0,0.18);
  }
  .recipe-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .recipe-inputs {
    display: flex;
    gap: 8px;
    flex: 1;
    align-items: center;
  }
  .input-cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
  }
  .input-swatch {
    width: 30px; height: 30px;
    border: 1.5px solid var(--banner-edge);
    border-radius: 2px;
  }
  .input-qty {
    font-family: 'Outfit', sans-serif;
    font-weight: 800;
    font-size: 8.5px;
    letter-spacing: 0.3px;
  }
  .input-qty.ok { color: #2e7a4e; }
  .input-qty.miss { color: var(--team-red-deep); }

  .recipe-arrow {
    font-family: 'Outfit', sans-serif;
    font-weight: 900;
    font-size: 18px;
    color: var(--brass-deep);
    padding: 0 4px;
  }
  .output-block {
    display: flex; flex-direction: column; align-items: center;
  }
  .output-swatch {
    width: 38px; height: 38px;
    border: 1.5px solid var(--banner-edge);
    border-radius: 2px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.25);
  }

  .recipe-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 8px;
    border-top: 1px dashed var(--parchment-edge);
  }
  .output-name {
    font-family: 'Outfit', sans-serif;
    font-weight: 800;
    font-size: 11px;
    color: var(--ink);
    letter-spacing: 1.2px;
    text-transform: uppercase;
  }
  .short-line {
    font-family: 'Outfit', sans-serif;
    font-weight: 700;
    font-size: 9px;
    color: var(--team-red-deep);
    letter-spacing: 0.8px;
    margin-top: 2px;
  }
  .craft-btn {
    padding: 6px 18px;
    background: linear-gradient(180deg, var(--tier-purple) 0%, #5a3a8a 100%);
    border: 1.5px solid var(--banner-edge);
    border-radius: 3px;
    font-family: 'Outfit', sans-serif;
    font-weight: 800;
    font-size: 11px;
    color: #fff;
    letter-spacing: 1.5px;
    cursor: pointer;
    text-transform: uppercase;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.3);
  }
  .craft-btn.disabled {
    background: linear-gradient(180deg, #8c7050 0%, #604830 100%);
    color: var(--ink-mute);
    cursor: default;
    box-shadow: none;
  }
</style>
</head>
<body>
<div class="phone"><div class="screen">

  <div class="topbar">
    <svg class="shield" viewBox="0 0 42 50" fill="none">
      <defs>
        <linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4d7ec4"/><stop offset="1" stop-color="#234a82"/></linearGradient>
        <linearGradient id="rg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbe6b0"/><stop offset="1" stop-color="#8a6028"/></linearGradient>
      </defs>
      <path d="M21 1 L39 5 L38 28 C38 39 30 46 21 49 C12 46 4 39 4 28 L3 5 Z" fill="url(#sg)" stroke="url(#rg)" stroke-width="1.8"/>
      <ellipse cx="21" cy="22" rx="7" ry="10" fill="#f0d088"/>
      <circle cx="16" cy="12" r="2.2" fill="#f0d088"/><circle cx="20" cy="10" r="1.8" fill="#f0d088"/><circle cx="24" cy="10" r="1.8" fill="#f0d088"/><circle cx="27" cy="12" r="1.8" fill="#f0d088"/>
    </svg>
    <div class="title-block">
      <div class="title">STRIDEKEEP:</div>
      <div class="subtitle">Season1 . CANYON</div>
    </div>
    <div class="utilities">
      <span class="util-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18 M12 3a13 13 0 010 18 M12 3a13 13 0 000 18"/></svg></span>
      <span class="util-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3h0a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5h0a1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8v0a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></span>
    </div>
  </div>

  <div class="stats">
    <div class="day-line">
      <span class="label-day">DAY 3</span> <span class="sep">·</span>
      <span class="countdown">11d 4h<span class="left"> LEFT</span></span>
    </div>
    <div class="stat-row">
      <div class="stat"><div class="num">4,345</div><div class="label">STEPS</div></div>
      <div class="stat-divider"></div>
      <div class="stat"><div class="num">$457</div><div class="label">PURSE</div></div>
    </div>
    <div class="tug">
      <div class="tug-side" style="flex:79">RED 79</div>
      <div class="tug-center">LEAD: RED +29</div>
      <div class="tug-side blue" style="flex:50">50 BLUE</div>
    </div>
  </div>

  <!-- Inventory sub-tabs (MIXING active) -->
  <div class="subtabs">
    <div class="subtab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="8" cy="10" r="1.5" fill="currentColor"/><circle cx="16" cy="10" r="1.5" fill="currentColor"/><circle cx="9" cy="15" r="1.5" fill="currentColor"/><circle cx="15" cy="15" r="1.5" fill="currentColor"/></svg>
      Colors
    </div>
    <div class="subtab active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v6 M15 3v6 M7 9h10l-1 11H8z"/></svg>
      Mixing
    </div>
  </div>

  <div class="content">
    <div class="kicker">
      <span>RECIPES</span>
      <span class="count">3</span>
    </div>

    <!-- Recipe 1: craftable -->
    <div class="recipe-card">
      <div class="recipe-row">
        <div class="recipe-inputs">
          <div class="input-cell">
            <div class="input-swatch" style="background:#c4543a"></div>
            <div class="input-qty ok">12/2</div>
          </div>
          <div class="input-cell">
            <div class="input-swatch" style="background:#e8b86a"></div>
            <div class="input-qty ok">5/1</div>
          </div>
        </div>
        <div class="recipe-arrow">→</div>
        <div class="output-block">
          <div class="output-swatch" style="background:#d8884a"></div>
        </div>
      </div>
      <div class="recipe-footer">
        <div>
          <div class="output-name">CANYON ORANGE</div>
        </div>
        <button class="craft-btn">CRAFT</button>
      </div>
    </div>

    <!-- Recipe 2: missing inputs -->
    <div class="recipe-card">
      <div class="recipe-row">
        <div class="recipe-inputs">
          <div class="input-cell">
            <div class="input-swatch" style="background:#6b3e1c"></div>
            <div class="input-qty ok">7/3</div>
          </div>
          <div class="input-cell">
            <div class="input-swatch" style="background:#8c5ec4;opacity:0.4"></div>
            <div class="input-qty miss">0/1</div>
          </div>
          <div class="input-cell">
            <div class="input-swatch" style="background:#3a2818"></div>
            <div class="input-qty ok">2/1</div>
          </div>
        </div>
        <div class="recipe-arrow">→</div>
        <div class="output-block">
          <div class="output-swatch" style="background:#5a3a3a"></div>
        </div>
      </div>
      <div class="recipe-footer">
        <div>
          <div class="output-name">DRIED BLOOD</div>
          <div class="short-line">NEED 1 MORE INPUT</div>
        </div>
        <button class="craft-btn disabled">CRAFT</button>
      </div>
    </div>

    <!-- Recipe 3: craftable -->
    <div class="recipe-card">
      <div class="recipe-row">
        <div class="recipe-inputs">
          <div class="input-cell">
            <div class="input-swatch" style="background:#9eaf60"></div>
            <div class="input-qty ok">6/2</div>
          </div>
          <div class="input-cell">
            <div class="input-swatch" style="background:#d8c5a0"></div>
            <div class="input-qty ok">11/1</div>
          </div>
        </div>
        <div class="recipe-arrow">→</div>
        <div class="output-block">
          <div class="output-swatch" style="background:#b8b074"></div>
        </div>
      </div>
      <div class="recipe-footer">
        <div>
          <div class="output-name">DRY GRASS</div>
        </div>
        <button class="craft-btn">CRAFT</button>
      </div>
    </div>
  </div>

  <div class="navbar">
    <div class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8 M5 10v10h5v-6h4v6h5V10"/></svg>
      <span>HOME</span>
    </div>
    <div class="nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V5a3 3 0 016 0v3"/></svg>
      <span>INVENTORY</span>
      <span class="nav-state">Active</span>
    </div>
  </div>

</div></div>
</body>
</html>
