<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Home · Cases — Stridekeep Wood/Canyon</title>
<link rel="stylesheet" href="shared.css">
<style>
  /* Cases-screen specific */
  .case-card {
    background: linear-gradient(180deg, var(--parchment-hi) 0%, var(--parchment) 100%);
    border: 1.5px solid var(--banner-edge);
    border-left-width: 5px;
    border-radius: 4px;
    padding: 10px 10px 10px 10px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.45),
      0 1px 3px rgba(0,0,0,0.18);
  }
  .case-card.starter { border-left-color: var(--tier-starter); }
  .case-card.quality { border-left-color: var(--tier-quality); }
  .case-card.fine { border-left-color: var(--tier-fine); }

  .medallion {
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 1.5px solid;
    display: grid; place-items: center;
    flex-shrink: 0;
    font-size: 20px;
    line-height: 1;
  }
  .medallion.starter {
    background: rgba(199,156,74,0.30);
    border-color: var(--tier-starter);
  }
  .medallion.quality {
    background: rgba(122,159,212,0.32);
    border-color: var(--tier-quality);
  }
  .medallion.fine {
    background: rgba(240,200,120,0.36);
    border-color: var(--tier-fine);
  }

  .case-meta { flex: 1; min-width: 0; }
  .case-name {
    font-family: 'Outfit', sans-serif;
    font-weight: 800;
    font-size: 13px;
    color: var(--ink);
    letter-spacing: 1.2px;
    text-transform: uppercase;
    margin-bottom: 5px;
  }
  .case-progress-line {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .case-bar-track {
    flex: 1;
    height: 4px;
    background: rgba(40, 24, 8, 0.30);
    border-radius: 2px;
    overflow: hidden;
  }
  .case-bar-fill {
    height: 100%;
    border-radius: 2px;
  }
  .case-bar-fill.starter { background: var(--tier-starter); }
  .case-bar-fill.quality { background: var(--tier-quality); }
  .case-bar-fill.fine { background: var(--tier-fine); }
  .case-progress-text {
    font-family: 'Outfit', sans-serif;
    font-weight: 700;
    font-size: 9.5px;
    color: var(--ink-soft);
    letter-spacing: 0.5px;
    min-width: 60px;
    text-align: right;
  }

  .pill-open {
    padding: 5px 12px;
    background: linear-gradient(180deg, var(--brass-light) 0%, var(--brass) 100%);
    border: 1.5px solid var(--banner-edge);
    border-radius: 13px;
    font-family: 'Outfit', sans-serif;
    font-weight: 800;
    font-size: 11px;
    color: var(--ink);
    letter-spacing: 1.5px;
    cursor: pointer;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.5);
  }
  .pill-idle {
    padding: 5px 11px;
    background: transparent;
    border: 1.5px solid var(--ink-mute);
    border-radius: 13px;
    font-family: 'Outfit', sans-serif;
    font-weight: 700;
    font-size: 10px;
    color: var(--ink-mute);
    letter-spacing: 1.2px;
  }
</style>
</head>
<body>
<div class="phone"><div class="screen">

  <div class="topbar">
    <svg class="shield" viewBox="0 0 42 50" fill="none">
      <defs>
        <linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4d7ec4"/><stop offset="1" stop-color="#234a82"/></linearGradient>
        <linearGradient id="rg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbe6b0"/><stop offset="1" stop-color="#8a6028"/></linearGradient>
      </defs>
      <path d="M21 1 L39 5 L38 28 C38 39 30 46 21 49 C12 46 4 39 4 28 L3 5 Z" fill="url(#sg)" stroke="url(#rg)" stroke-width="1.8"/>
      <ellipse cx="21" cy="22" rx="7" ry="10" fill="#f0d088"/>
      <circle cx="16" cy="12" r="2.2" fill="#f0d088"/><circle cx="20" cy="10" r="1.8" fill="#f0d088"/><circle cx="24" cy="10" r="1.8" fill="#f0d088"/><circle cx="27" cy="12" r="1.8" fill="#f0d088"/>
    </svg>
    <div class="title-block">
      <div class="title">STRIDEKEEP:</div>
      <div class="subtitle">Season1 . CANYON</div>
    </div>
    <div class="utilities">
      <span class="util-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18 M12 3a13 13 0 010 18 M12 3a13 13 0 000 18"/></svg></span>
      <span class="util-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3h0a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5h0a1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8v0a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></span>
    </div>
  </div>

  <div class="stats">
    <div class="day-line">
      <span class="label-day">DAY 3</span> <span class="sep">·</span>
      <span class="countdown">11d 4h<span class="left"> LEFT</span></span>
    </div>
    <div class="stat-row">
      <div class="stat"><div class="num">4,345</div><div class="label">STEPS</div></div>
      <div class="stat-divider"></div>
      <div class="stat"><div class="num">$457</div><div class="label">PURSE</div></div>
    </div>
    <div class="tug">
      <div class="tug-side" style="flex:79">RED 79</div>
      <div class="tug-center">LEAD: RED +29</div>
      <div class="tug-side blue" style="flex:50">50 BLUE</div>
    </div>
  </div>

  <!-- Sub-tabs (CASES active) -->
  <div class="subtabs">
    <div class="subtab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 16l5-5 4 4 3-3 6 6"/><circle cx="9" cy="10" r="1.5" fill="currentColor"/></svg>
      Mural
    </div>
    <div class="subtab active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>
      Cases
    </div>
    <div class="subtab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
      Profile
    </div>
  </div>

  <div class="content">
    <div class="kicker"><span>MATERIALS</span></div>

    <!-- Fine case (3 pending - OPEN) -->
    <div class="case-card fine">
      <div class="medallion fine">⬢</div>
      <div class="case-meta">
        <div class="case-name">FINE CASE</div>
        <div class="case-progress-line">
          <div class="case-bar-track"><div class="case-bar-fill fine" style="width:78%"></div></div>
          <div class="case-progress-text">3 PENDING</div>
        </div>
      </div>
      <button class="pill-open">OPEN</button>
    </div>

    <!-- Quality case (1.3K / 4K - IDLE) -->
    <div class="case-card quality">
      <div class="medallion quality">◆</div>
      <div class="case-meta">
        <div class="case-name">QUALITY CASE</div>
        <div class="case-progress-line">
          <div class="case-bar-track"><div class="case-bar-fill quality" style="width:34%"></div></div>
          <div class="case-progress-text">1.3K / 4K</div>
        </div>
      </div>
      <div class="pill-idle">2.7K LEFT</div>
    </div>

    <!-- Starter case (1 pending - OPEN) -->
    <div class="case-card starter">
      <div class="medallion starter">●</div>
      <div class="case-meta">
        <div class="case-name">STARTER CASE</div>
        <div class="case-progress-line">
          <div class="case-bar-track"><div class="case-bar-fill starter" style="width:62%"></div></div>
          <div class="case-progress-text">1 PENDING</div>
        </div>
      </div>
      <button class="pill-open">OPEN</button>
    </div>
  </div>

  <div class="navbar">
    <div class="nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8 M5 10v10h5v-6h4v6h5V10"/></svg>
      <span>HOME</span>
      <span class="nav-state">Active</span>
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V5a3 3 0 016 0v3"/></svg>
      <span>INVENTORY</span>
    </div>
  </div>

</div></div>
</body>
</html>
